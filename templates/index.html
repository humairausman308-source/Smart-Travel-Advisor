<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Travel Advisor</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --sand:   #f5f0e8;
      --cream:  #fdfaf4;
      --ink:    #1a1612;
      --terra:  #c0622a;
      --gold:   #d4a843;
      --sage:   #5a7a5c;
      --muted:  #7a6e62;
      --card-bg: #ffffff;
      --border: rgba(26,22,18,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ─── HERO ─────────────────────────────────────── */
    .hero {
      background: var(--ink);
      color: var(--cream);
      padding: 3.5rem 1.5rem 4rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 70% 40%, rgba(192,98,42,0.25) 0%, transparent 60%),
                  radial-gradient(ellipse at 20% 80%, rgba(212,168,67,0.15) 0%, transparent 50%);
      pointer-events: none;
    }
    .hero-label {
      font-size: 0.72rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 0.75rem;
    }
    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      font-weight: 900;
      line-height: 1.1;
      margin-bottom: 1rem;
    }
    .hero h1 span { color: var(--gold); }
    .hero p {
      color: rgba(253,250,244,0.65);
      font-size: 1rem;
      max-width: 440px;
      margin: 0 auto 2rem;
      font-weight: 300;
    }

    /* ─── SEARCH ────────────────────────────────────── */
    .search-wrap {
      display: flex;
      gap: 0;
      max-width: 520px;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    #country-input {
      flex: 1;
      border: none;
      padding: 1rem 1.25rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      background: var(--cream);
      color: var(--ink);
      outline: none;
    }
    #country-input::placeholder { color: var(--muted); }
    #search-btn {
      border: none;
      background: var(--terra);
      color: #fff;
      padding: 1rem 1.6rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }
    #search-btn:hover { background: #a8541f; }
    #search-btn:disabled { background: var(--muted); cursor: not-allowed; }

    /* ─── MAIN CONTAINER ────────────────────────────── */
    .main-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }

    /* ─── STATE PANELS ──────────────────────────────── */
    #state-idle, #state-loading, #state-error, #state-results {
      display: none;
    }
    #state-idle { display: block; }

    .idle-hint {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
    }
    .idle-hint i { font-size: 3rem; color: var(--gold); opacity: 0.5; margin-bottom: 1rem; display: block; }
    .idle-hint p { font-size: 0.95rem; }

    /* Loading */
    .loading-wrap {
      text-align: center;
      padding: 5rem 1rem;
    }
    .spinner-ring {
      width: 56px; height: 56px;
      border: 4px solid var(--border);
      border-top-color: var(--terra);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-wrap p { color: var(--muted); font-size: 0.95rem; }

    /* Error */
    .error-wrap {
      text-align: center;
      padding: 4rem 1rem;
    }
    .error-icon { font-size: 2.8rem; color: #c0392b; margin-bottom: 0.75rem; }
    .error-msg {
      background: #fff5f5;
      border: 1px solid #fcc;
      border-radius: 10px;
      padding: 1.1rem 1.5rem;
      color: #8b1a1a;
      display: inline-block;
      font-size: 0.97rem;
      max-width: 480px;
    }

    /* ─── COUNTRY HEADER ────────────────────────────── */
    .country-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .flag-box img {
      height: 68px;
      border-radius: 6px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.18);
      display: block;
    }
    .country-title h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
    }
    .country-title .region-badge {
      display: inline-block;
      background: var(--sand);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.2rem 0.8rem;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* ─── CARDS ─────────────────────────────────────── */
    .info-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      height: 100%;
      transition: box-shadow 0.2s;
    }
    .info-card:hover { box-shadow: 0 6px 24px rgba(0,0,0,0.07); }

    .card-heading {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .card-heading i { font-size: 1.1rem; color: var(--terra); }
    .card-heading h3 {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
    }

    /* Stat rows inside cards */
    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.45rem 0;
      border-bottom: 1px solid rgba(26,22,18,0.05);
      font-size: 0.93rem;
    }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { color: var(--muted); font-weight: 400; }
    .stat-value { font-weight: 500; text-align: right; max-width: 55%; word-break: break-word; }

    /* Weather card specifics */
    .weather-big {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .weather-big img { width: 60px; height: 60px; }
    .weather-big .temp {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      font-weight: 700;
      line-height: 1;
    }
    .weather-big .desc {
      font-size: 0.92rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    /* Tags (languages, currencies) */
    .tag-list { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .tag {
      background: var(--sand);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.22rem 0.75rem;
      font-size: 0.82rem;
      color: var(--ink);
    }

    /* Wiki sections */
    .wiki-text {
      font-size: 0.92rem;
      line-height: 1.7;
      color: #3a3028;
    }
    .wiki-section + .wiki-section { margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid var(--border); }
    .wiki-section-label {
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--terra);
      font-weight: 500;
      margin-bottom: 0.4rem;
    }

    /* Partial error notice inside card */
    .partial-error {
      font-size: 0.85rem;
      color: var(--muted);
      font-style: italic;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .partial-error i { color: #e0a020; }

    /* ─── RESPONSIVE ─────────────────────────────────── */
    @media (max-width: 576px) {
      .country-header { flex-direction: column; align-items: flex-start; }
      .hero h1 { font-size: 2rem; }
    }
  </style>
</head>

<body>

  <!-- HERO / SEARCH -->
  <header class="hero">
    <p class="hero-label">Powered by live data</p>
    <h1>Smart <span>Travel</span> Advisor</h1>
    <p>Enter any country to get weather, facts, food & travel insights instantly.</p>

    <div class="search-wrap">
      <input
        type="text"
        id="country-input"
        placeholder="e.g. Japan, Morocco, Brazil…"
        autocomplete="off"
        maxlength="100"
        aria-label="Country name"
      />
      <button id="search-btn" aria-label="Search">
        <i class="bi bi-search"></i> Explore
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main-container">

    <!-- Idle hint -->
    <div id="state-idle">
      <div class="idle-hint">
        <i class="bi bi-globe2"></i>
        <p>Type a country name above and hit <strong>Explore</strong> to begin.</p>
      </div>
    </div>

    <!-- Loading -->
    <div id="state-loading">
      <div class="loading-wrap">
        <div class="spinner-ring"></div>
        <p>Gathering travel data…</p>
      </div>
    </div>

    <!-- Global error -->
    <div id="state-error">
      <div class="error-wrap">
        <div class="error-icon"><i class="bi bi-exclamation-triangle"></i></div>
        <div class="error-msg" id="error-msg-text">Something went wrong.</div>
      </div>
    </div>

    <!-- Results -->
    <div id="state-results">

      <!-- Country header -->
      <div class="country-header">
        <div class="flag-box"><img id="flag-img" src="" alt="Flag" /></div>
        <div class="country-title">
          <h2 id="country-name-title"></h2>
          <span class="region-badge" id="region-badge"></span>
        </div>
      </div>

      <!-- Row 1: Country Facts + Weather -->
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <div class="info-card">
            <div class="card-heading">
              <i class="bi bi-info-circle"></i>
              <h3>Country Facts</h3>
            </div>
            <div id="facts-body"></div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="info-card">
            <div class="card-heading">
              <i class="bi bi-cloud-sun"></i>
              <h3>Current Weather</h3>
            </div>
            <div id="weather-body"></div>
          </div>
        </div>
      </div>

      <!-- Row 2: Languages + Currencies -->
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <div class="info-card">
            <div class="card-heading">
              <i class="bi bi-translate"></i>
              <h3>Languages</h3>
            </div>
            <div id="languages-body" class="tag-list"></div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="info-card">
            <div class="card-heading">
              <i class="bi bi-currency-exchange"></i>
              <h3>Currencies</h3>
            </div>
            <div id="currencies-body" class="tag-list"></div>
          </div>
        </div>
      </div>

      <!-- Row 3: Tourism + Food (Wikipedia) -->
      <div class="row g-3">
        <div class="col-12">
          <div class="info-card">
            <div class="card-heading">
              <i class="bi bi-map"></i>
              <h3>Tourism &amp; Cuisine</h3>
            </div>
            <div id="wiki-body"></div>
          </div>
        </div>
      </div>

    </div><!-- /#state-results -->
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
